<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Open in Kiron</title>
  <meta property="og:title" content="Shared from Kiron" />
  <meta property="og:description" content="A workout or gym setup, ready to add in Kiron." />
  <meta property="og:image" content="https://trykiron.com/og-image.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>.share { max-width: 560px; margin: 0 auto; padding: 80px 0; text-align: center; } .share p { color: var(--muted); margin: 16px 0 32px; } .share .btn { display: inline-block; margin: 6px; }</style>
</head>
<body>
  <div class="container">
    <div class="share">
      <h1 id="title">Someone shared a workout with you</h1>
      <p>Get Kiron to add it to your workouts. If you already have it, open it in Kiron.</p>
      <a id="open" href="kiron://" class="btn btn-primary">Open in Kiron</a>
      <a href="https://apps.apple.com/us/app/kiron-build-train-track/id6761926770" class="btn btn-secondary">App Store</a>
      <a href="https://play.google.com/store/apps/details?id=com.kiron" class="btn btn-secondary">Google Play</a>
    </div>
  </div>
  <script>
    var m = location.pathname.match(/^\/(w|g)\/([A-Za-z0-9]{20})/);
    if (m) {
      document.getElementById("open").href = "kiron://" + m[1] + "/" + m[2];
      if (m[1] === "g") document.getElementById("title").textContent = "Someone shared their gym setup with you";
    }
  </script>
</body>
</html>
